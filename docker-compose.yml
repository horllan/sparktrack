
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sparktrack-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sparktrack_dev_2026
      POSTGRES_DB: sparktrack
    volumes:
      - sparktrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparktrack-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - sparktrack_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sparktrack_pgdata:
  sparktrack_redis:
